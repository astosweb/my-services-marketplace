services:
  postgres:
    image: postgres:18
    container_name: gobid-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: gobid
      POSTGRES_PASSWORD: gobid
      POSTGRES_DB: gobid
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gobid -d gobid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: gobid-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: gobid-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://gobid:gobid@postgres:5432/gobid
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET in the deployment environment}
      UPLOAD_SIGNING_SECRET: ${UPLOAD_SIGNING_SECRET:-}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001,http://localhost:3002}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3002/reset-password}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      UPLOAD_STORAGE: spaces
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}
      ENABLE_SWAGGER: "false"
      SEED_ON_START: "false"
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:?Set SPACES_ENDPOINT}
      SPACES_REGION: ${SPACES_REGION:?Set SPACES_REGION}
      SPACES_BUCKET: ${SPACES_BUCKET:?Set SPACES_BUCKET}
      SPACES_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID:?Set SPACES_ACCESS_KEY_ID}
      SPACES_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY:?Set SPACES_SECRET_ACCESS_KEY}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-ee.gobid.app}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
    volumes:
      - upload_data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    container_name: gobid-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      API_URL: http://api:3000
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3002}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: gobid-web
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      API_URL: http://api:3000
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  upload_data:

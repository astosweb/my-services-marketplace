name: API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/api-ci.yml"

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://gobid:gobid@localhost:5433/gobid

      - name: Lint
        working-directory: apps/api
        run: pnpm lint

      - name: Typecheck
        working-directory: apps/api
        run: pnpm typecheck
        env:
          DATABASE_URL: postgresql://gobid:gobid@localhost:5433/gobid
          JWT_SECRET: ci-test-secret-at-least-32-characters-long

      - name: Test
        working-directory: apps/api
        run: pnpm test
        env:
          DATABASE_URL: postgresql://gobid:gobid@localhost:5433/gobid
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          NODE_ENV: test

      - name: Build
        working-directory: apps/api
        run: pnpm build
        env:
          DATABASE_URL: postgresql://gobid:gobid@localhost:5433/gobid
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
